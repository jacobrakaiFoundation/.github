name: Claude code review

# Reviews pull requests against this repository. This is the organization's
# front door, so the review brief below is about facts, links and brand rules
# rather than the usual code concerns — almost nothing here is code.
#
# Requires a `CLAUDE_CODE_OAUTH_TOKEN` repository or organization secret — a
# long-lived token from `claude setup-token`, billed to the Claude subscription
# rather than to API credits. Until that secret exists the review step is
# skipped rather than failing, so adding this workflow cannot turn every pull
# request red.
#
# The same gate means pull requests from forks are never reviewed: GitHub does
# not expose secrets to `pull_request` runs from a fork, so the key reads empty
# and the step skips. That is the safe default — a fork PR can change this
# workflow, and handing it a credential would hand it the key. Reviewing forks
# would need `pull_request_target`, which runs untrusted code against the base
# repo's secrets, and is not worth it for this repository.
#
# Actions are pinned to full commit SHAs with the version in a trailing comment,
# per docs/MONITORING.md — a floating tag resolves to whatever it points at today.
#
# To authenticate with a pay-as-you-go API key instead, replace the
# `claude_code_oauth_token` input with `anthropic_api_key` and set
# `ANTHROPIC_API_KEY` in place of `CLAUDE_CODE_OAUTH_TOKEN` below. An API key
# with no credit balance fails with "Your credit balance is too low" (PR #8).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write
# `id-token: write` is not about the Anthropic key. The action exchanges the
# job's GitHub OIDC token for a short-lived installation token from the Claude
# GitHub App (installed org-wide), and posts the review as that app. Without it
# the step fails with "Could not fetch an OIDC token" — seen on PR #8. The
# alternative is passing `github_token: ${{ secrets.GITHUB_TOKEN }}`, which
# posts as github-actions[bot] instead.

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Review the pull request
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          claude_args: |
            --model claude-opus-5
          prompt: |
            Review this pull request to the Jacobrakai Foundation's organization
            profile repository. This repository holds the page rendered at
            github.com/jacobrakaiFoundation plus the documents describing how it
            is built. It is public-facing content for a 501(c)(3) that publishes
            legal information and security research, so accuracy matters more
            than style.

            Read `docs/BRAND.md`, `docs/ARTWORK.md` and `docs/LEGAL.md` first —
            they are the standards this repository holds itself to — then review
            the diff against them.

            What to look for, roughly in priority order:

            1. Factual drift. Every claim on the profile page should match what
               the live sites actually say: jacobrakai.org, formapauperis.com,
               in.formapauperis.com and sicsempererrata.com. Check numbers,
               dates, form identifiers and rule citations against their sources.
               The tax-exempt paragraph must stay consistent with
               `docs/LEGAL.md`.
            2. Overclaiming. House style publishes each capability next to its
               limit — "legal information, not legal advice", "static analysis
               only — nothing was executed", "planned and not available for
               purchase". Flag any edit that drops a limit, softens one, or
               states a capability without its caveat.
            3. Links. Wrong destinations matter more than dead ones here: a link
               that resolves but lands on the wrong page is the failure this
               repository has actually shipped before. Check that each link goes
               where its text promises.
            4. GitHub's markdown sanitizer. It strips `<svg>`, `class` and
               `style`, and allows only a fixed set of elements and attributes.
               Markup outside that set disappears silently on the rendered page
               rather than erroring. Flag anything that would be stripped.
            5. Brand rules in `docs/BRAND.md`. In particular: the masthead SVGs
               are frozen and must stay byte-identical; light and dark asset
               pairs must not drift apart; stroke weight follows an asset's
               display width; no text, scripts or external references inside
               SVGs; no volatile number baked into artwork.
            6. Accessibility. Informative images need real alt text, decorative
               ones need `alt=""` and must never sit inside a link, heading
               levels should not skip, and no fact should exist only inside an
               image.

            Be specific and quote the line you mean. If the change is sound, say
            so briefly rather than inventing findings.
